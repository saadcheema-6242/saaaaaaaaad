<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passport Scanner</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#16181d; --muted:#667085; --line:#e4e7ec;
          --accent:#2457f5; --ok:#067647; --okbg:#ecfdf3; --bad:#b42318; --badbg:#fef3f2;
          --warn:#b54708; --warnbg:#fffaeb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b21; --text:#eceef2; --muted:#98a2b3; --line:#2a2f38;
            --accent:#6c8cff; --ok:#6ce9a6; --okbg:#0c2a1c; --bad:#fda29b; --badbg:#2d1311;
            --warn:#fec84b; --warnbg:#2e2410; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { max-width:820px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  h2 { font-size:1.05rem; margin:0; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .drop { border:2px dashed var(--line); border-radius:12px; padding:28px 16px; text-align:center;
          color:var(--muted); cursor:pointer; }
  .drop.over { border-color:var(--accent); color:var(--accent); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--text);
           padding:10px 16px; border-radius:8px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:8px;
           background:var(--card); color:var(--text); }
  video, img.preview { width:100%; max-height:360px; object-fit:contain; border-radius:8px;
                       background:#000; margin-top:12px; display:none; }
  img.preview { background:transparent; }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:8px 4px; border-bottom:1px solid var(--line); vertical-align:top; text-align:left; }
  .fields td:first-child { color:var(--muted); width:38%; }
  .badge { display:inline-block; padding:2px 10px; border-radius:99px; font-size:.85rem; font-weight:600; }
  .ok { background:var(--okbg); color:var(--ok); }
  .bad { background:var(--badbg); color:var(--bad); }
  .warn { background:var(--warnbg); color:var(--warn); }
  pre { background:var(--bg); padding:12px; border-radius:8px; overflow-x:auto; font-size:.85rem; margin:8px 0 0; }
  .err { color:var(--bad); background:var(--badbg); padding:12px; border-radius:8px; }
  .hidden { display:none; }
  .checks { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .spread { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .toolbar label { color:var(--muted); font-size:.9rem; }
  td.copy-td { width:1%; white-space:nowrap; text-align:right; }
  .copy-cell { padding:3px 10px; font-size:.78rem; border-radius:6px; color:var(--muted); }
  .copy-cell:hover { color:var(--accent); border-color:var(--accent); }
  .mrz-block { position:relative; }
  .mrz-block #copyMrz { position:absolute; top:14px; right:8px; }
  .exp { font-size:.78rem; font-weight:600; padding:1px 8px; border-radius:99px; margin-left:6px; }
  .list-wrap { overflow-x:auto; }
  table.people { font-size:.9rem; white-space:nowrap; }
  table.people th { color:var(--muted); font-weight:600; font-size:.8rem; }
  .mini { padding:4px 9px; font-size:.78rem; border-radius:6px; }
  .x { color:var(--bad); border-color:var(--line); }
  .muted { color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>Passport Scanner</h1>
  <p class="sub">Scan a passport, copy the fields straight into your appointment form. Everyone you scan is saved to the list below.</p>

  <div class="card">
    <div class="toolbar">
      <label for="dateFmt">Date format</label>
      <select id="dateFmt">
        <option value="DD/MM/YYYY">DD/MM/YYYY  (29/12/1977)</option>
        <option value="MM/DD/YYYY">MM/DD/YYYY  (12/29/1977)</option>
        <option value="DD-MM-YYYY">DD-MM-YYYY  (29-12-1977)</option>
        <option value="DD MMM YYYY">DD MMM YYYY (29 Dec 1977)</option>
        <option value="YYYY-MM-DD">YYYY-MM-DD  (1977-12-29)</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="drop" id="drop">Drop a passport image here, or click to choose a file</div>
    <input type="file" id="file" accept="image/*" hidden>
    <video id="video" playsinline muted></video>
    <img id="preview" class="preview" alt="Preview">
    <canvas id="canvas" hidden></canvas>
    <div class="row">
      <button id="camBtn">Use webcam</button>
      <button id="snapBtn" class="hidden">Capture photo</button>
      <button id="scanBtn" class="primary" disabled>Scan passport</button>
      <button id="nextBtn" class="hidden">Scan next</button>
    </div>
  </div>

  <div id="status"></div>
  <div id="result" class="card hidden"></div>

  <div class="card" id="listCard">
    <div class="spread">
      <h2>Scanned people (<span id="count">0</span>)</h2>
      <div class="row" style="margin:0">
        <button id="exportBtn" class="mini">Export CSV</button>
        <button id="clearBtn" class="mini x">Clear all</button>
      </div>
    </div>
    <div id="listBody"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const drop = $("drop"), fileInput = $("file"), video = $("video"), preview = $("preview"),
      canvas = $("canvas"), camBtn = $("camBtn"), snapBtn = $("snapBtn"), scanBtn = $("scanBtn"),
      nextBtn = $("nextBtn"), statusEl = $("status"), resultEl = $("result");

let blob = null, stream = null, current = null;

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- formatting helpers ---------- */
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(iso, fmt) {
  if (!iso) return "";
  const p = iso.split("-"); if (p.length !== 3) return iso;
  const [y, m, d] = p;
  switch (fmt) {
    case "DD/MM/YYYY": return `${d}/${m}/${y}`;
    case "MM/DD/YYYY": return `${m}/${d}/${y}`;
    case "DD-MM-YYYY": return `${d}-${m}-${y}`;
    case "DD MMM YYYY": return `${d} ${MON[(+m || 1) - 1]} ${y}`;
    default: return iso;
  }
}
function curFmt() { return $("dateFmt").value; }
const GENDER = { M: "Male", F: "Female", X: "Unspecified" };
function genderName(s) { return GENDER[s] || s || ""; }

const COUNTRIES = {
AFG:"Afghanistan",ALB:"Albania",DZA:"Algeria",AND:"Andorra",AGO:"Angola",ATG:"Antigua and Barbuda",ARG:"Argentina",
ARM:"Armenia",AUS:"Australia",AUT:"Austria",AZE:"Azerbaijan",BHS:"Bahamas",BHR:"Bahrain",BGD:"Bangladesh",
BRB:"Barbados",BLR:"Belarus",BEL:"Belgium",BLZ:"Belize",BEN:"Benin",BTN:"Bhutan",BOL:"Bolivia",
BIH:"Bosnia and Herzegovina",BWA:"Botswana",BRA:"Brazil",BRN:"Brunei",BGR:"Bulgaria",BFA:"Burkina Faso",
BDI:"Burundi",CPV:"Cabo Verde",KHM:"Cambodia",CMR:"Cameroon",CAN:"Canada",CAF:"Central African Republic",
TCD:"Chad",CHL:"Chile",CHN:"China",COL:"Colombia",COM:"Comoros",COG:"Congo",COD:"Congo (DRC)",CRI:"Costa Rica",
CIV:"Côte d'Ivoire",HRV:"Croatia",CUB:"Cuba",CYP:"Cyprus",CZE:"Czechia",DNK:"Denmark",DJI:"Djibouti",
DMA:"Dominica",DOM:"Dominican Republic",ECU:"Ecuador",EGY:"Egypt",SLV:"El Salvador",GNQ:"Equatorial Guinea",
ERI:"Eritrea",EST:"Estonia",SWZ:"Eswatini",ETH:"Ethiopia",FJI:"Fiji",FIN:"Finland",FRA:"France",GAB:"Gabon",
GMB:"Gambia",GEO:"Georgia",DEU:"Germany",D:"Germany",GHA:"Ghana",GRC:"Greece",GRD:"Grenada",GTM:"Guatemala",
GIN:"Guinea",GNB:"Guinea-Bissau",GUY:"Guyana",HTI:"Haiti",HND:"Honduras",HUN:"Hungary",ISL:"Iceland",
IND:"India",IDN:"Indonesia",IRN:"Iran",IRQ:"Iraq",IRL:"Ireland",ISR:"Israel",ITA:"Italy",JAM:"Jamaica",
JPN:"Japan",JOR:"Jordan",KAZ:"Kazakhstan",KEN:"Kenya",KIR:"Kiribati",PRK:"North Korea",KOR:"South Korea",
KWT:"Kuwait",KGZ:"Kyrgyzstan",LAO:"Laos",LVA:"Latvia",LBN:"Lebanon",LSO:"Lesotho",LBR:"Liberia",LBY:"Libya",
LIE:"Liechtenstein",LTU:"Lithuania",LUX:"Luxembourg",MDG:"Madagascar",MWI:"Malawi",MYS:"Malaysia",MDV:"Maldives",
MLI:"Mali",MLT:"Malta",MHL:"Marshall Islands",MRT:"Mauritania",MUS:"Mauritius",MEX:"Mexico",FSM:"Micronesia",
MDA:"Moldova",MCO:"Monaco",MNG:"Mongolia",MNE:"Montenegro",MAR:"Morocco",MOZ:"Mozambique",MMR:"Myanmar",
NAM:"Namibia",NRU:"Nauru",NPL:"Nepal",NLD:"Netherlands",NZL:"New Zealand",NIC:"Nicaragua",NER:"Niger",
NGA:"Nigeria",MKD:"North Macedonia",NOR:"Norway",OMN:"Oman",PAK:"Pakistan",PLW:"Palau",PSE:"Palestine",
PAN:"Panama",PNG:"Papua New Guinea",PRY:"Paraguay",PER:"Peru",PHL:"Philippines",POL:"Poland",PRT:"Portugal",
QAT:"Qatar",ROU:"Romania",RUS:"Russia",RWA:"Rwanda",KNA:"Saint Kitts and Nevis",LCA:"Saint Lucia",
VCT:"Saint Vincent and the Grenadines",WSM:"Samoa",SMR:"San Marino",STP:"Sao Tome and Principe",
SAU:"Saudi Arabia",SEN:"Senegal",SRB:"Serbia",SYC:"Seychelles",SLE:"Sierra Leone",SGP:"Singapore",
SVK:"Slovakia",SVN:"Slovenia",SLB:"Solomon Islands",SOM:"Somalia",ZAF:"South Africa",SSD:"South Sudan",
ESP:"Spain",LKA:"Sri Lanka",SDN:"Sudan",SUR:"Suriname",SWE:"Sweden",CHE:"Switzerland",SYR:"Syria",
TWN:"Taiwan",TJK:"Tajikistan",TZA:"Tanzania",THA:"Thailand",TLS:"Timor-Leste",TGO:"Togo",TON:"Tonga",
TTO:"Trinidad and Tobago",TUN:"Tunisia",TUR:"Türkiye",TKM:"Turkmenistan",TUV:"Tuvalu",UGA:"Uganda",
UKR:"Ukraine",ARE:"United Arab Emirates",GBR:"United Kingdom",USA:"United States",URY:"Uruguay",
UZB:"Uzbekistan",VUT:"Vanuatu",VAT:"Vatican City",VEN:"Venezuela",VNM:"Vietnam",YEM:"Yemen",ZMB:"Zambia",
ZWE:"Zimbabwe",UTO:"Utopia (specimen)"
};
function countryName(code) { return COUNTRIES[code] || code || ""; }

function expiryInfo(iso) {
  if (!iso) return { label: "", cls: "" };
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const exp = new Date(iso + "T00:00:00");
  if (isNaN(exp)) return { label: "", cls: "" };
  const days = Math.round((exp - today) / 86400000);
  if (days < 0) return { label: "expired", cls: "bad" };
  if (days <= 180) {
    const mo = Math.floor(days / 30);
    return { label: "expires in " + (mo >= 1 ? mo + " mo" : days + " d"), cls: "warn" };
  }
  return { label: "", cls: "" };
}

/* ---------- clipboard ---------- */
async function copyToClipboard(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch {}
    ta.remove(); return ok;
  }
}
function flashBtn(btn, label) {
  const old = btn.dataset.label || btn.textContent;
  btn.dataset.label = old; btn.textContent = label;
  setTimeout(() => { btn.textContent = btn.dataset.label; }, 1300);
}

/* ---------- people store (localStorage) ---------- */
let people = loadPeople();
function loadPeople() { try { return JSON.parse(localStorage.getItem("pp_people") || "[]"); } catch { return []; } }
function savePeople() { try { localStorage.setItem("pp_people", JSON.stringify(people)); } catch {} }

function personFromScan(d) {
  return {
    surname: d.surname || "", name: d.given_names || "",
    dobISO: d.date_of_birth || "", passport: d.passport_number || "",
    expiryISO: d.expiry_date || "", sex: d.sex || "",
    nationalityCode: d.nationality || "", issuingCode: d.issuing_country || "",
    personal: d.personal_number || "", mrz1: d.mrz_line1 || "", mrz2: d.mrz_line2 || "",
    valid: !!d.valid, expired: !!d.expired, checks: d.checks || {}
  };
}
// Values in appointment-form order, for row/CSV copy.
function orderedValues(p) {
  return [p.surname, p.name, fmtDate(p.dobISO, curFmt()), p.passport,
          fmtDate(p.expiryISO, curFmt()), genderName(p.sex), countryName(p.nationalityCode)];
}
function rowText(p) { return orderedValues(p).join("\t"); }

function addPerson(p) {
  const key = (x) => (x.passport || "") + "|" + (x.dobISO || "");
  const i = people.findIndex(x => key(x) === key(p));
  if (i >= 0) people[i] = p; else people.push(p);
  savePeople(); renderList();
}

/* ---------- scanner ---------- */
function setImage(b) {
  blob = b;
  preview.src = URL.createObjectURL(b);
  preview.style.display = "block";
  video.style.display = "none";
  scanBtn.disabled = false;
  resultEl.classList.add("hidden");
  statusEl.innerHTML = "";
}
function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.style.display = "none"; snapBtn.classList.add("hidden");
}
drop.onclick = () => fileInput.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => {
  e.preventDefault(); drop.classList.remove("over");
  if (e.dataTransfer.files[0]) { stopCamera(); setImage(e.dataTransfer.files[0]); }
};
fileInput.onchange = () => { if (fileInput.files[0]) { stopCamera(); setImage(fileInput.files[0]); } };

camBtn.onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 } } });
    video.srcObject = stream; await video.play();
    video.style.display = "block"; preview.style.display = "none";
    snapBtn.classList.remove("hidden");
  } catch (e) {
    statusEl.innerHTML = '<div class="err">Camera unavailable: ' + esc(e.message) + ' (needs HTTPS or localhost).</div>';
  }
};
snapBtn.onclick = () => {
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);
  canvas.toBlob(b => { stopCamera(); setImage(new File([b], "capture.jpg", { type: "image/jpeg" })); }, "image/jpeg", 0.95);
};
nextBtn.onclick = () => {
  blob = null; current = null;
  preview.style.display = "none"; preview.removeAttribute("src");
  fileInput.value = "";
  scanBtn.disabled = true;
  resultEl.classList.add("hidden");
  nextBtn.classList.add("hidden");
  statusEl.innerHTML = "";
  window.scrollTo({ top: 0, behavior: "smooth" });
};

scanBtn.onclick = async () => {
  if (!blob) return;
  scanBtn.disabled = true;
  statusEl.innerHTML = '<div class="card">Scanning…</div>';
  resultEl.classList.add("hidden");
  const fd = new FormData();
  fd.append("file", blob, blob.name || "scan.jpg");
  try {
    const r = await fetch("/api/scan", { method: "POST", body: fd });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "Scan failed");
    statusEl.innerHTML = "";
    current = personFromScan(data);
    addPerson(current);          // auto-save so nothing is lost
    renderDetail(current);
    nextBtn.classList.remove("hidden");
  } catch (e) {
    statusEl.innerHTML = '<div class="err">' + esc(e.message) + '</div>';
  } finally { scanBtn.disabled = false; }
};

/* ---------- detail view ---------- */
function renderDetail(p) {
  const labels = { passport_number:"Passport no.", date_of_birth:"Date of birth", expiry_date:"Expiry date",
                   personal_number:"Personal no.", composite:"Overall" };
  const checks = Object.entries(p.checks || {}).map(([k, v]) =>
    `<span class="badge ${v ? "ok" : "bad"}">${labels[k] || k} ${v ? "✓" : "✗"}</span>`).join("");

  const fmt = curFmt();
  const fields = [
    ["Surname", p.surname],
    ["Name", p.name],
    ["Date of Birth", fmtDate(p.dobISO, fmt)],
    ["Passport", p.passport],
    ["Passport's Expiration Date", fmtDate(p.expiryISO, fmt)],
    ["Gender", genderName(p.sex)],
    ["Nationality", countryName(p.nationalityCode)],
    ["Issuing country", countryName(p.issuingCode)],
    ["Personal number", p.personal || "—"],
  ];
  const exp = expiryInfo(p.expiryISO);
  const rows = fields.map(([k, v]) => {
    const val = String(v ?? "");
    const tag = (k === "Passport's Expiration Date" && exp.label)
      ? ` <span class="exp ${exp.cls}">${exp.label}</span>` : "";
    return `<tr><td>${k}</td><td>${esc(val)}${tag}</td>
      <td class="copy-td"><button class="copy-cell" data-copy="${esc(val)}" title="Copy ${esc(k)}">Copy</button></td></tr>`;
  }).join("");

  const copyAll = fields.map(([k, v]) => `${k}: ${v}`).join("\n")
    + `\nValid: ${p.valid}\nMRZ:\n${p.mrz1}\n${p.mrz2}`;

  resultEl.innerHTML = `
    <div class="spread">
      <span class="badge ${p.valid ? "ok" : "bad"}">${p.valid ? "All check digits valid" : "Check failed — rescan or correct manually"}</span>
      <div class="row" style="margin:0">
        <button id="copyRow" class="mini primary">Copy row ↹</button>
        <button id="copyAll" class="mini">Copy all</button>
      </div>
    </div>
    <div class="checks">${checks}</div>
    <table class="fields" style="margin-top:12px">${rows}</table>
    <div class="mrz-block">
      <pre id="mrzPre">${esc(p.mrz1)}\n${esc(p.mrz2)}</pre>
      <button class="copy-cell" id="copyMrz" data-copy="${esc(p.mrz1 + "\n" + p.mrz2)}" title="Copy MRZ">Copy MRZ</button>
    </div>
    <p class="muted" style="margin:10px 0 0">Saved to the list below. Tab-paste a whole person with “Copy row”.</p>`;
  resultEl.classList.remove("hidden");

  $("copyRow").onclick = async (e) => flashBtn(e.currentTarget, (await copyToClipboard(rowText(p))) ? "Copied ✓" : "Failed");
  $("copyAll").onclick = async (e) => flashBtn(e.currentTarget, (await copyToClipboard(copyAll)) ? "Copied ✓" : "Failed");
  resultEl.querySelectorAll(".copy-cell").forEach(btn => {
    btn.onclick = async () => flashBtn(btn, (await copyToClipboard(btn.getAttribute("data-copy"))) ? "Copied ✓" : "Failed");
  });
}

/* ---------- people list ---------- */
function renderList() {
  $("count").textContent = people.length;
  if (!people.length) {
    $("listBody").innerHTML = '<p class="muted">No one scanned yet. Scanned passports appear here automatically.</p>';
    return;
  }
  const head = ["#", "Surname", "Name", "DoB", "Passport", "Expiry", "Gender", "Nationality", ""];
  const body = people.map((p, i) => {
    const exp = expiryInfo(p.expiryISO);
    const expCell = esc(fmtDate(p.expiryISO, curFmt())) + (exp.label ? ` <span class="exp ${exp.cls}">${exp.label}</span>` : "");
    return `<tr>
      <td>${i + 1}</td>
      <td>${esc(p.surname)}</td>
      <td>${esc(p.name)}</td>
      <td>${esc(fmtDate(p.dobISO, curFmt()))}</td>
      <td>${esc(p.passport)}</td>
      <td>${expCell}</td>
      <td>${esc(genderName(p.sex))}</td>
      <td>${esc(countryName(p.nationalityCode))}</td>
      <td style="text-align:right; white-space:nowrap">
        <button class="mini rowcopy" data-i="${i}">Copy row</button>
        <button class="mini x del" data-i="${i}" title="Remove">✕</button>
      </td></tr>`;
  }).join("");
  $("listBody").innerHTML =
    `<div class="list-wrap"><table class="people"><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`;

  $("listBody").querySelectorAll(".rowcopy").forEach(b =>
    b.onclick = async () => flashBtn(b, (await copyToClipboard(rowText(people[+b.dataset.i]))) ? "Copied ✓" : "Failed"));
  $("listBody").querySelectorAll(".del").forEach(b =>
    b.onclick = () => { people.splice(+b.dataset.i, 1); savePeople(); renderList(); });
}

/* ---------- export ---------- */
function csvCell(s) { s = String(s ?? ""); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
$("exportBtn").onclick = () => {
  if (!people.length) return;
  const head = ["Surname", "Name", "Date of Birth", "Passport", "Passport's Expiration Date", "Gender", "Nationality"];
  const lines = [head.join(",")].concat(people.map(p => orderedValues(p).map(csvCell).join(",")));
  const blobCsv = new Blob([lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blobCsv);
  a.download = "passports-" + new Date().toISOString().slice(0, 10) + ".csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$("clearBtn").onclick = () => {
  if (!people.length) return;
  if (!confirm("Remove all " + people.length + " scanned people from the list?")) return;
  people = []; savePeople(); renderList();
};

/* ---------- date format persistence + initial render ---------- */
(function initFmt() {
  let saved = ""; try { saved = localStorage.getItem("pp_datefmt") || ""; } catch {}
  if (saved) $("dateFmt").value = saved;
})();
$("dateFmt").onchange = () => {
  try { localStorage.setItem("pp_datefmt", $("dateFmt").value); } catch {}
  if (current) renderDetail(current);
  renderList();
};
renderList();
</script>
</body>
</html>
